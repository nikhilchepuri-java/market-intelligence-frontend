name: V3 Frontend CI
on:
  push:
    branches: [ main, 'v3-*', 'realtime-*' ]
  pull_request:
    branches: [ main, 'v3-*' ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run build
